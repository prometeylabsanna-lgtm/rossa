upstream backend_server {
    server backend:8000;
}

# HTTP: ACME challenge + редірект на HTTPS (канон — без www)
server {
    listen 80;
    server_name rossamebel.com.ua www.rossamebel.com.ua;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rossamebel.com.ua$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.rossamebel.com.ua;

    ssl_certificate /etc/letsencrypt/live/rossamebel.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rossamebel.com.ua/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://rossamebel.com.ua$request_uri;
}

# HTTPS сайт
server {
    listen 443 ssl;
    http2 on;
    server_name rossamebel.com.ua;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/rossamebel.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rossamebel.com.ua/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    include /etc/nginx/mime.types;
    types {
        image/webp webp;
        image/avif avif;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
