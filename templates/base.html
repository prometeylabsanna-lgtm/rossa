{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'uk' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if seo_title %}{{ seo_title }}{% else %}ROSSA{% endif %}</title>
  <meta name="description" content="{% if seo_description %}{{ seo_description }}{% endif %}">
  <link rel="canonical" href="{{ canonical_url|default:request.build_absolute_uri }}">
  <meta property="og:title" content="{% if seo_title %}{{ seo_title }}{% else %}ROSSA{% endif %}">
  <meta property="og:description" content="{% if seo_description %}{{ seo_description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical_url|default:request.build_absolute_uri }}">
  {% if og_image %}<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{{ og_image }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/reset.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/header.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/footer.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/cards.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/home.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/catalog.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages/inner.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="page {% block body_class %}{% endblock %}">
  {% include "includes/header.html" %}
  <main class="page__main">
    {% block content %}{% endblock %}
  </main>
  {% include "includes/footer.html" %}
  <div class="fab">
    <a class="fab__btn" href="tel:{{ site_settings.phone|cut:' ' }}" data-qa="lead-form" aria-label="{% trans 'Зателефонувати' %}">
      <svg class="fab__icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
    </a>
    <a class="fab__btn" href="{{ site_settings.telegram_url }}" rel="noopener noreferrer" target="_blank" aria-label="{% trans 'Написати в Telegram' %}">
      <svg class="fab__icon fab__icon--telegram" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
    </a>
  </div>
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/nav.js' %}" defer></script>
  <script src="{% static 'js/product-card.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
