{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'uk' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if seo_title %}{{ seo_title }}{% else %}ROSSA{% endif %}</title>
  <meta name="description" content="{% if seo_description %}{{ seo_description }}{% endif %}">
  <link rel="canonical" href="{{ canonical_url|default:request.build_absolute_uri }}">
  <link rel="icon" href="{% static 'images/favicon/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
  <meta property="og:title" content="{% if seo_title %}{{ seo_title }}{% else %}ROSSA{% endif %}">
  <meta property="og:description" content="{% if seo_description %}{{ seo_description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical_url|default:request.build_absolute_uri }}">
  {% if og_image %}<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{{ og_image }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/variables.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/reset.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/components/header.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/components/mobile-nav.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/components/footer.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/components/cards.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/components/forms.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/pages/home.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/pages/catalog.css' %}?v={{ static_v }}">
  <link rel="stylesheet" href="{% static 'css/pages/inner.css' %}?v={{ static_v }}">
  {% block extra_css %}{% endblock %}
  <noscript><style>.reveal{opacity:1;-webkit-transform:none;transform:none}.about-band__props{opacity:1}.about-band__prop::before,.about-band__prop::after,.milestones::before{-webkit-transform:none;transform:none;-webkit-animation:none;animation:none}</style></noscript>
</head>
<body class="page {% block body_class %}{% endblock %}">
  {% include "includes/header.html" %}
  <main class="page__main">
    {% block content %}{% endblock %}
  </main>
  {% include "includes/footer.html" %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/nav.js' %}?v={{ static_v }}" defer></script>
  <script src="{% static 'js/product-card.js' %}" defer></script>
  <script src="{% static 'js/reveal.js' %}?v={{ static_v }}" defer></script>
  <script src="{% static 'js/parallax.js' %}?v={{ static_v }}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
