{% load i18n %}
<div class="product-grid" data-qa="product-grid" id="product-grid">
  {% include "partials/product_cards.html" %}
</div>
<div id="catalog-more">
  {% if has_more %}
    <div class="more">
      <a class="btn btn--ghost"
         href="?{% if listing_qs %}{{ listing_qs }}&{% endif %}offset={{ next_offset }}"
         hx-get="?{% if listing_qs %}{{ listing_qs }}&{% endif %}offset={{ next_offset }}"
         hx-target="#product-grid"
         hx-swap="beforeend"
         hx-indicator="this">
        {% trans "Показати ще" %}
      </a>
    </div>
  {% endif %}
</div>
