{% extends "base.html" %}
{% load i18n static rossa %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/pages/legal.css' %}?v={{ static_v }}">
{% endblock %}
{% block body_class %}page--inner page--legal{% endblock %}
{% block content %}
  {% include "includes/breadcrumbs.html" %}
  <article class="legal">
    <h1 class="serif-title reveal reveal--up">{{ page.title }}</h1>
    <div class="legal__card reveal reveal--up" data-reveal-delay="100">
      <div class="legal__body cms-html">{{ page.body|cms_html }}</div>
    </div>
  </article>
{% endblock %}
