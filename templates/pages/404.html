{% extends "base.html" %}
{% load i18n static %}
{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/pages/inner.css' %}?v={{ static_v }}">
{% endblock %}
{% block site_js %}{% endblock %}
{% block content %}
  <section class="not-found reveal reveal--up">
    <h1>{% trans "Сторінку не знайдено" %}</h1>
    <p class="page-intro">{% trans "Перейдіть до каталогу або на головну." %}</p>
    <a class="btn btn--ghost" href="{% url 'core:home' %}">{% trans "На головну" %}</a>
    <a class="btn btn--outline" href="{% url 'catalog:index' %}">{% trans "До каталогу" %}</a>
  </section>
{% endblock %}
