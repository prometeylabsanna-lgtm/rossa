<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./image-slot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<div style="background:#F8F8F8; display:flex; flex-direction:column; cursor:pointer; width:100%;" onClick="{{ handleOpen }}">
  <div style="position:relative; width:100%; aspect-ratio:16/9; background:#F8F8F8; overflow:hidden;">
    <sc-if value="{{ product.badge }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute; top:14px; left:14px; background:{{ accentColor }}; color:#FFFFFF; font-size:11px; letter-spacing:0.09em; padding:5px 12px; border-radius:6px; text-transform:uppercase; z-index:2; font-family:'Montserrat',sans-serif; font-weight:600;">{{ product.badge }}</div>
    </sc-if>
    <sc-for list="{{ swatchesWithActive }}" as="sw" hint-placeholder-count="1">
      <sc-if value="{{ sw.active }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute; inset:0;" onClick="{{ stop }}">
          <image-slot id="{{ sw.slotId }}" shape="rect" fit="contain" placeholder="Фото моделі" src="{{ sw.src }}" style="width:100%;height:100%;"></image-slot>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="padding:18px 16px 20px; background:#F8F8F8;">
    <div style="font-size:12px; color:#4C4C4C; text-transform:uppercase; letter-spacing:0.08em; font-family:'Montserrat',sans-serif;">{{ product.category }}</div>
    <div style="font-family:'Montserrat',sans-serif; font-size:24px; color:#1A1817; margin-top:5px; line-height:1.1;">{{ product.name }}</div>
    <div style="font-size:13px; color:#4C4C4C; opacity:0.9; margin-top:3px; font-family:'Montserrat',sans-serif;">{{ product.type }}</div>
    <div style="font-size:15px; color:#1A1817; margin-top:10px; font-weight:600; font-family:'Montserrat',sans-serif;">від {{ product.priceFormatted }} грн</div>
    <div style="display:flex; gap:9px; margin-top:14px;">
      <sc-for list="{{ swatchesWithActive }}" as="sw" hint-placeholder-count="3">
        <div style="width:20px;height:20px;border-radius:50%; background:{{ sw.hex }}; cursor:pointer; box-shadow:0 0 0 2px {{ sw.borderColor }}; box-sizing:border-box;" onClick="{{ sw.select }}"></div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;,&quot;default&quot;:{&quot;name&quot;:&quot;Мілан&quot;,&quot;type&quot;:&quot;Модульний диван&quot;,&quot;category&quot;:&quot;Дивани&quot;,&quot;price&quot;:48900,&quot;badge&quot;:&quot;NEW&quot;,&quot;swatches&quot;:[{&quot;hex&quot;:&quot;#6B6255&quot;,&quot;slotId&quot;:&quot;preview-a&quot;},{&quot;hex&quot;:&quot;#C7BBA3&quot;,&quot;slotId&quot;:&quot;preview-b&quot;},{&quot;hex&quot;:&quot;#903838&quot;,&quot;slotId&quot;:&quot;preview-c&quot;}]}},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(product:object)=&gt;void&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#903838&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#903838&quot;,&quot;#E2B4BD&quot;,&quot;#1A1817&quot;]}}">
class Component extends DCLogic {
  state = { activeIndex: 0 };
  renderVals() {
    const product = this.props.product || { swatches: [], name: '', type: '', category: '', price: 0 };
    const idx = this.state.activeIndex;
    const swatchesWithActive = (product.swatches || []).map((s, i) => ({
      hex: s.hex,
      slotId: s.slotId,
      src: s.src,
      active: i === idx,
      borderColor: i === idx ? '#1A1817' : 'transparent',
      select: () => this.setState({ activeIndex: i })
    }));
    return {
      product: { ...product, priceFormatted: (product.price || 0).toLocaleString('uk-UA') },
      accentColor: this.props.accentColor || '#903838',
      swatchesWithActive,
      handleOpen: () => this.props.onOpen && this.props.onOpen(product),
      stop: (e) => e && e.stopPropagation && e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
